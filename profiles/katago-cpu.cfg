# Local 9x9 reference: KataGo v1.18.1, Eigen CPU, historical b6c96 net.
# Deliberately modest search budget for this Qualcomm ARM Windows machine.
# The arena verifies rules and disables resignation/pondering at startup.
logDir = gtp_logs
logAllGTPCommunication = true
logSearchInfo = false
logSearchInfoForChosenMove = false
logToStderr = false
homeDataDir = data
defaultBoardSize = 9

koRule = SIMPLE
scoringRule = AREA
taxRule = NONE
multiStoneSuicideLegal = false
hasButton = false
whiteHandicapBonus = 0
friendlyPassOk = false

allowResignation = false
resignThreshold = -0.90
resignConsecTurns = 3
ponderingEnabled = false
delayMoveScale = 0
delayMoveMax = 0

maxVisits = 32
maxTime = 2.0
numSearchThreads = 1
nnMaxBatchSize = 1
nnCacheSizePowerOfTwo = 16
nnMutexPoolSizePowerOfTwo = 12
